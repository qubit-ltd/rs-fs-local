name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  rust-ci:
    uses: qubit-ltd/rs-local-files/.github/workflows/repository-ci.yml@main
    with:
      repository: rs-fs-local
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit

  downstream-contracts:
    name: Coordinated downstream contracts
    permissions:
      contents: read
    uses: qubit-ltd/rs-local-files/.github/workflows/downstream-contracts.yml@main
    with:
      local_files_ref: main
      fs_local_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      mime_ref: main
      support_ref: main
