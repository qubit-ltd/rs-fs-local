name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  rust-ci:
    uses: qubit-ltd/rs-ci/.github/workflows/rust-ci.yml@14ec4b152a19f8be585730f6ee945bc5ff822ad8
    with:
      run_windows_tests: true
      run_macos_tests: true
