name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main

  windows-adapter-tests:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Compile all local adapter tests on Windows
        run: cargo check --locked --no-default-features --features registry --tests
      - name: Run local adapter tests on Windows
        run: cargo test --locked --no-default-features --features registry --test path_tests --test local_file_uri_path_tests --test local_error_mapping_tests --test local_temp_resource_spi_tests --test local_range_read_tests
      - name: Run temporary cleanup budget tests on Windows
        run: cargo test --locked --no-default-features --features registry --test local_temp_cleanup_policy_tests
      - name: Run local range reader unit tests on Windows
        run: "cargo test --locked --no-default-features --features registry --lib spi::local_range_reader::tests::"
      - name: Run local URI unit tests on Windows
        run: "cargo test --locked --no-default-features --features registry --lib registry::local_file_uri_path::tests::"
