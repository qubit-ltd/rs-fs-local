name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: qubit-ltd/rs-dependency-policy/.github/actions/check@39895c60b725068b7a72dc14d0ae18ee60c30e46
        with:
          project: .

  rust-ci:
    uses: qubit-ltd/rs-local-files/.github/workflows/repository-ci.yml@main
    with:
      repository: rs-fs-local
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit

  downstream-contracts:
    name: Coordinated downstream contracts
    permissions:
      contents: read
    uses: qubit-ltd/rs-local-files/.github/workflows/downstream-contracts.yml@main
    with:
      local_files_ref: main
      fs_local_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      mime_ref: main
      support_ref: main
