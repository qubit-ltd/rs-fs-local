[package]
name = "qubit-fs-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-fs-local"
description = "Local filesystem provider for qubit-fs"
homepage = "https://github.com/qubit-ltd/rs-fs-local"
documentation = "https://docs.rs/qubit-fs-local"
readme = "README.md"
include = [
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/README.zh_CN.md",
  "/src/**",
  "/tests/**",
]
keywords = ["filesystem", "local", "provider", "qubit"]
categories = ["filesystem"]

[lib]
name = "qubit_fs_local"
doctest = true

[[test]]
name = "local_file_system_provider_tests"
path = "tests/local_file_system_provider_tests.rs"
required-features = ["registry"]

[dependencies]
qubit-fs = { path = "../rs-fs", version = "0.2" }
qubit-local-files = { path = "../rs-local-files", version = "0.7.1" }
qubit-fs-registry = { path = "../rs-fs-registry", version = "0.1", optional = true }
qubit-spi = { path = "../rs-spi", version = "0.10", optional = true }

[features]
default = []
registry = ["dep:qubit-fs-registry", "dep:qubit-spi"]

[dev-dependencies]
qubit-io = { path = "../rs-io", version = "0.14" }
qubit-fs-testkit = { path = "../rs-fs-testkit", version = "0.1" }
tempfile = "3.27"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
