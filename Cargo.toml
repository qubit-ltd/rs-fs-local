[package]
name = "qubit-fs-local"
version = "0.10.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-fs-local"
description = "Local filesystem provider for qubit-fs"
homepage = "https://github.com/qubit-ltd/rs-fs-local"
documentation = "https://docs.rs/qubit-fs-local"
readme = "README.md"
include = [
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/README.zh_CN.md",
  "/benches/**",
  "/doc/**",
  "/examples/**",
  "/src/**",
  "/tests/**",
]
keywords = ["filesystem", "local", "provider", "qubit"]
categories = ["filesystem"]
metadata.docs.rs.all-features = true

[lib]
name = "qubit_fs_local"
doctest = true

[[test]]
name = "local_file_system_provider_tests"
path = "tests/local_file_system_provider_tests.rs"
required-features = ["registry"]

[[test]]
name = "local_file_uri_path_tests"
path = "tests/local_file_uri_path_tests.rs"
required-features = ["registry"]

[[test]]
name = "local_provider_mode_tests"
path = "tests/local_provider_mode_tests.rs"
required-features = ["registry"]

[[test]]
name = "local_inventory_tests"
path = "tests/local_inventory_tests.rs"
required-features = ["registry"]

[[bench]]
name = "local_filesystem_facade"
harness = false

[dependencies]
qubit-fs = { version = "0.2", default-features = false }
qubit-local-files = "0.4"
qubit-io = "0.17"
qubit-fs-registry = { version = "0.7", optional = true }
qubit-spi = { version = "0.13", optional = true }

[features]
default = []
registry = ["dep:qubit-fs-registry", "dep:qubit-spi", "qubit-fs-registry/inventory", "qubit-spi/inventory"]

[dev-dependencies]
proptest = "^1.11"
toml = "^0.9"
serde_json = "^1.0"
criterion = "^0.8"
tempfile = "^3.27"
qubit-io = "0.17"
qubit-fs-testkit = "0.7"
qubit-local-files = { version = "0.4", features = ["test-support"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
