[package]
name = "qubit-fs-local"
version = "0.11.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-fs-local"
description = "Local filesystem provider for qubit-fs"
homepage = "https://github.com/qubit-ltd/rs-fs-local"
documentation = "https://docs.rs/qubit-fs-local"
readme = "README.md"
include = [
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/README.zh_CN.md",
  "/benches/**",
  "/doc/**",
  "/examples/**",
  "/src/**",
  "/tests/**",
]
keywords = ["filesystem", "local", "provider", "qubit"]
categories = ["filesystem"]
metadata.docs.rs.all-features = true

[lib]
name = "qubit_fs_local"
doctest = true

[[test]]
name = "local_file_system_provider_tests"
path = "tests/local_file_system_provider_tests.rs"
required-features = ["registry"]

[[test]]
name = "local_file_uri_path_tests"
path = "tests/local_file_uri_path_tests.rs"
required-features = ["registry"]

[[test]]
name = "local_provider_mode_tests"
path = "tests/local_provider_mode_tests.rs"
required-features = ["registry"]

[[test]]
name = "local_inventory_tests"
path = "tests/local_inventory_tests.rs"
required-features = ["registry"]

[[test]]
name = "local_range_read_tests"
path = "tests/spi_tests/local_range_reader_tests.rs"

[[test]]
name = "local_path_mapper_tests"
path = "tests/path_tests/local_path_mapper_tests.rs"

[[bench]]
name = "local_filesystem_facade"
harness = false

[dependencies]
qubit-fs = { path = "../rs-fs", version = "0.3", default-features = false }
qubit-local-files = { path = "../rs-local-files", version = "0.5" }
qubit-io = "0.19"
qubit-fs-registry = { path = "../rs-fs-registry", version = "0.8", optional = true }
qubit-redact = { path = "../rs-redact", version = "0.10", optional = true }
qubit-spi = { version = "0.13", optional = true }

[features]
default = []
registry = [
  "dep:qubit-fs-registry",
  "dep:qubit-redact",
  "dep:qubit-spi",
  "qubit-fs-registry/inventory",
  "qubit-spi/inventory",
]

[dev-dependencies]
proptest = "^1.11"
toml = "^0.9"
serde_json = "^1.0"
criterion = "^0.8"
tempfile = "^3.27"
qubit-io = "0.19"
qubit-fs-testkit = { path = "../rs-fs-testkit", version = "0.8" }
qubit-local-files = { path = "../rs-local-files", version = "0.5", features = ["test-support"] }

[patch.crates-io]
qubit-fs = { path = "../rs-fs" }
qubit-local-files = { path = "../rs-local-files" }
qubit-redact = { path = "../rs-redact" }
qubit-fs-testkit = { path = "../rs-fs-testkit" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
