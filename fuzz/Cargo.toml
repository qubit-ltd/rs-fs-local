[package]
name = "qubit-fs-local-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "^0.4"
qubit-fs-local = { path = "../", features = ["registry"], version = "^0.12" }
qubit-fs = { version = "^0.4", path = "../../rs-fs" }
qubit-fs-registry = { version = "^0.8", path = "../../rs-fs-registry" }

[[bin]]
name = "registry_uri_resolution"
path = "fuzz_targets/registry_uri_resolution.rs"
test = false
doc = false
bench = false
